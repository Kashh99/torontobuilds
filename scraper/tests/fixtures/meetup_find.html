<script type="application/ld+json" data-next-head="">[{"@context":"https://schema.org","@type":"Event","name":"TechTalk (In-Person) - September 2026","url":"https://www.meetup.com/torontojs/events/316396828/","description":"After a brief pause, we're back with another in-person event.\n\nHere’s the September edition of our Tech Talk event at Super.com on September 29, 2026\n\nJoin us for some drinks, snacks, and Tech Talks.\n\nMake sure to mark your calendars, come out, and join us for this event!\n\n**🕑 Agenda & Schedule ✨**\n\n* 18:00 - Doors open\n* 18:20 - Intro and announcements\n\n* 18:30 - **httpstate - Synchronizing state across all of your apps** by **[Alex Morales](https://httpstate.com)**\n*Abstract*: Moving data between frontend, backend, apps, and databases usually requires complex wiring. httpstate is a lightweight library that handles end-to-end state management in just a few lines of code—eliminating boilerplate so you can transfer data without the setup overhead.\n\n* 19:00 - **Strudel - live-coding music in your browser with Javascript** by **[Fabio Neves](https://fabioneves.ca)**\n*Abstract*: Code isn't just for apps—it makes real-time music. While tools like TidalCycles and Sonic Pi require external setups, Strudel is a self-contained JS live-coding tool running straight in your browser via the Web Audio API. Join us as we explore live-coding history and code an EDM track live 🎛️🎚️\n\n* 19:30 - Networking\n* 21:00 - Doors Close\n\n(**Note**: *All times in the schedule are an approximation.*)\n\nPlease RSVP to confirm your attendance. If you have your friends or teammates joining please ask them to RSVP as well.\n\nThis event is open to all skill levels.\n\nMany thanks to [Super.com](Super.com) for hosting us!\n\nWe're looking for sponsors for events like these. If you or your company would like to support TorontoJS and get a message out to our community, please get in touch with organizers@torontojs.com\n\nThe Code of Conduct is enforced at all TorontoJS events and spaces - online or in-person.\n\nTorontoJS is a volunteer-led not-for-profit organization.\n\n**Please help us** with tidying up. Otherwise, the venue staff and volunteers will have to pick up after you.\n\\-\\-\\-\n\n# **The Venue 🏠**\n\nThe venue is next door to Shoppers Drug Mart, a nondescript door that you'll have to look for a little carefully.\n\\-\\-\\-\n*TorontoJS is committed to creating a safe and inclusive environment for all. Our Code of Conduct applies both online and in person at all our events and spaces.*\n\nSee you there! 🎉","startDate":"2026-09-29T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-2-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Super.com","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"260 Queen St W, Toronto, ON M5V 1Z4, Canada, Toronto, ON"}},"organizer":{"@type":"Organization","name":"Toronto JavaScript","url":"https://www.meetup.com/torontojs/"},"performer":"Toronto JavaScript"},{"@context":"https://schema.org","@type":"Event","name":"Automatic Writing - Explore Your Unconscious","url":"https://www.meetup.com/unconscious/events/315874477/","description":"# Automatic Writing\n\nAutomatic writing is a simple practice used to explore what may be operating beneath the surface of conscious thought.\nDuring this guided session, we will write continuously without stopping to edit, organize, judge, or decide whether what appears makes sense. By temporarily stepping around the mind’s usual filters, automatic writing can bring forward unexpected memories, emotions, images, associations, conflicts, and insights.\nThe goal is not to produce good writing. It is to let the unconscious speak before the conscious mind has time to correct it.\nThrough a series of guided prompts and periods of uninterrupted writing, participants will explore their inner experience, notice recurring themes, and discover thoughts or feelings that may have been difficult to access directly.\nNo writing experience is necessary. Participants are never required to share what they write.\n\n## About the Facilitator\n\nDillon Freed holds a master’s degree in cognitive neuroscience and a bachelor’s degree in psychology. He teaches neuroscience in college and he is the founder of the Letting Go Center, where he creates experiences focused on emotional release, consciousness, self-exploration, and personal transformation.","startDate":"2026-09-30T23:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-2-square.webp","eventAttendanceMode":"https://schema.org/OnlineEventAttendanceMode","location":{"@type":"VirtualLocation","url":"https://www.meetup.com/unconscious/events/315874477/"},"organizer":{"@type":"Organization","name":"How to Explore Your Unconscious","url":"https://www.meetup.com/unconscious/"},"performer":"How to Explore Your Unconscious"},{"@context":"https://schema.org","@type":"Event","name":"Dev Days 2026 @ NorthTorontoUG (In-person event!)","url":"https://www.meetup.com/northtorontoug/events/316397020/","description":"​Join us for **Dev Days 2026** **@ North Toronto Cloud & DevOps User Group** (in-person event) in **Toronto**!\n\nWe're bringing together builders, maintainers, and developers across Toronto's growing tech community for a night focused on **modern GitHub‑powered workflows**, open tooling, and hands‑on learning.\n\n**⭐ FREE REGISTRATION (Important! Please read!) ⭐**\n\n**\\* Step 1**: RSVP here to show your interest so that we will bring you more events like this in the future.\n\n**\\* Step 2**: This is an in-person event hosted at the Microsoft Canadian Headquarters. For security, you **must** have a unique QR Code in order to enter the Microsoft Headquarters.\n\n▶️ **To get your unique QR Code**, please go to [this link](https://luma.com/5mthp0p6) and click \"**Request to Join**\".\n\n\\* Your unique QR Code will be sent to you before the event.\n\n**Planning is underway. RSVP now to reserve your spot. Space is limited.**\n\n​Whether you use VS Code, JetBrains, Cursor, Claude Code, or any other tool in your stack, this meetup is GitHub‑centric but fully tool‑agnostic — come as you are, code how you like.\n\nThis is a great event for GitHub, Azure, AI, and DevOps enthusiasts!\n\n**Hosted By**\n\n* Jack Lee - Microsoft MVP, Cloud Solutions Architect\n* Ricardo Covo - Microsoft Solution Engineer\n* Max Yermakhanov - Microsoft MVP\n* David Lloyd - Microsoft MVP","startDate":"2026-10-21T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Microsoft Canadian Headquarters (Suite 4400)","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"81 Bay St., Toronto, ON"}},"organizer":{"@type":"Organization","name":"North Toronto Cloud & DevOps User Group","url":"https://www.meetup.com/northtorontoug/"},"performer":"North Toronto Cloud & DevOps User Group"},{"@context":"https://schema.org","@type":"Event","name":"M365 Toronto 2026 - Full-day In-person Event","url":"https://www.meetup.com/northtorontoug/events/316051953/","description":"**North Toronto Cloud & DevOps User Group** is a proud supporter of **M365 Toronto 2026**.\n\nHere's a sneak peek of what's in store:\n\n🎤 Inspiring Keynote + Speaker Presentations: Gain insights from renowned Microsoft MVP and community experts as they share their vision for the future of Microsoft and its impact across various industries.\n\n💡 Thought-Provoking Panel Discussions: Engage in thought-provoking discussions various topics on the latest technologies and the implications of organizations. Your perspective matters, so join the conversation!\n\n🚀 Sponsor Showcases: Discover local, national, and international companies that work in the space and see how their innovative solutions are shaping the future of technology. Who knows? You might witness the next big breakthrough right here!\n\n🤝 Networking Opportunities: Connect with like-minded individuals, forge valuable connections, and expand your professional network within the vibrant Microsoft community of Toronto.\n\n🎉 Fun and Entertainment: Enjoy live demonstrations, activities, and interactive exhibits that promise to entertain and inspire attendees of all ages.\n\n⛑️ This is a PAID event ($10 or $20 with a T-shirt) but ALL profits will go to charity and so we can get commitment on numbers to order food for.\n\nStay tuned for more updates and surprises. We can't wait to welcome you to the M365 Toronto event of the year in Toronto! 🌟\n\n**Registration**\n\n* Please [RSVP here](https://www.meetup.com/northtorontoug/events/316051953/) to show your interest.\n* Then, **reserve your spot** at our Eventbrite [registration site](https://www.eventbrite.ca/e/m365-toronto-2026-tickets-1994300791352) to receive the QR code to attend the event in person.\n\nFor more info, visit the [official site](https://www.communitydays.org/event/2026-10-02/m365-toronto-2026).\n\nDon't miss out on this incredible opportunity to immerse yourself in the fascinating world of Microsoft and connect with fellow enthusiasts and experts. Reserve your spot today and get ready to embark on an unforgettable journey with us!","startDate":"2026-10-02T12:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Microsoft Canadian Headquarters (Suite 4400)","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"81 Bay St., Toronto, ON"}},"organizer":{"@type":"Organization","name":"North Toronto Cloud & DevOps User Group","url":"https://www.meetup.com/northtorontoug/"},"performer":"North Toronto Cloud & DevOps User Group"},{"@context":"https://schema.org","@type":"Event","name":"Building Intelligent Java Apps: Agent Patterns, MCP, and the Future of AI Native","url":"https://www.meetup.com/toronto-java-users-group/events/316595726/","description":"\\*\\* Note special location for this event: the IBM offices at 16 York Street, on the 7th Floor.\\*\\*\n\nDoors open at 6:00. Theresa Mammarella will be on site to sign guests in.\n\nThe talk will start at 6:30.\n\n**Topic**\n\n**Building Intelligent Java Apps: Agent Patterns, MCP, and the Future of AI Native Design**\n\nAs AI rapidly evolves from model experimentation to production-grade applications, Java developers are increasingly faced with a new paradigm: designing intelligent systems that can reason, interact, and adapt. This talk explores the emerging Java AI application development journey through the lens of agent-based architecture, with a focus on how the Model Context Protocol (MCP) and Agent2Agent (A2A) communication patterns are transforming the way we build intelligent, context-aware services. We’ll walk through the foundational shifts in building AI-native Java applications—moving beyond single-shot prompt-response interactions to multiagent coordination, persistent memory, and tool-augmented reasoning. We’ll also address the critical architectural trade-offs: performance versus flexibility, open source versus vendor-managed inference, local versus remote model deployment, and how to maintain security and observability in agent-based systems.\n\n**About the speaker**\nDaniel Oh\n\nJava Champion, CNCF Ambassador & TAG DevEX Co-Chair, AAIF Ambassador, Microsoft MVP, Developer Advocate, Technical Marketing, Keynote Speaker, Published Author","startDate":"2026-10-05T22:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"16 York St","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"16 York St, Toronto, ON"}},"organizer":{"@type":"Organization","name":"Toronto Java Users Group","url":"https://www.meetup.com/toronto-java-users-group/"},"performer":"Toronto Java Users Group"},{"@context":"https://schema.org","@type":"Event","name":"GitHub Copilot Dev Days Toronto","url":"https://www.meetup.com/toronto-enterprise-devops-user-group/events/316393717/","description":"**REGISTER AT [https://luma.com/5mthp0p6](https://luma.com/5mthp0p6)** instead of Meetup for this event\\*\\*.\\*\\* This event takes place at Microsoft Headquarters building which requires attendees to register using provided link to get QR code to a unique QR Code in order to enter the Microsoft Headquarters.\n\nPlanning is underway. RSVP now to reserve your spot. Space is limited.\n\nDev Days is a global, in-person, community-led experience bringing developers, DevOps enthusiasts, and local tech communities together to discover what’s possible with GitHub Copilot.\nThis isn’t your typical conference talk series. It’s a hands-on opportunity to explore real-world workflows, practical use cases, and the latest ways to put GitHub Copilot to work.\n\nJoin us for interactive demos, hands-on activities, and workshops focused on GitHub Copilot — and leave with practical skills, ideas, and techniques you can start using right away.\n\nCome curious. Get hands-on. Build something. See what GitHub Copilot can really do.\n\nEvent is co-hosted with Microsoft and North Toronto Cloud & DevOps User Group.","startDate":"2026-10-21T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-2-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Microsoft Canada HQ Downtown","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"on","addressCountry":"ca","streetAddress":"4400-81 Bay Street, Toronto, on"}},"organizer":{"@type":"Organization","name":"Toronto Enterprise DevOps User Group","url":"https://www.meetup.com/toronto-enterprise-devops-user-group/"},"performer":"Toronto Enterprise DevOps User Group"},{"@context":"https://schema.org","@type":"Event","name":"7 Ways You Can Build an Amazing Dev Career in the AI Era","url":"https://www.meetup.com/toronto-java-users-group/events/316707940/","description":"**Note special location: Intuit, 8 Spadina Ave, 19th Floor**\n\n**7 Ways You Can Build an Amazing Dev Career in the AI Era**\n\nAre you also wondering where you fit in all of this?\n\nEvery day, you are bombarded with claims that AI will transform software development. Is this an unprecedented opportunity or an existential threat?\n\nAfter more than 30 years in the software industry, I've seen technologies create opportunities, destroy opportunities, and completely reshape careers.\n\nYet... there are always professionals who seem to thrive regardless of the changes happening around them.\n\nWhy do some become more valuable... while others struggle?\n\nThis presentation will face the myths around AI head-on and explore how you can create opportunities in the age of AI... instead of being afraid and scrambling to keep up.\n\nBecause the future may belong to those who understand something deeper than technology itself...\n\n**About the venue**\nIntuit has generously offered to host Toronto JUG in their downtown office at The Well. They will provide some food and drinks.\n\n**Speaker Bio**\nSince 1995, Bruno has been helping Java developers advance their careers and work on exciting projects. A recognized Java Evangelist and Java Champion, as well as a board member of the Java Community Process, Bruno founded and leads SouJava, the Brazilian Java Users Society. In his book, \"Developer Career Masterplan,\" Bruno shares insights on career development for senior developers, topics he further explores in his Code4.life project.","startDate":"2026-10-13T22:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-3-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Intuit","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"8 Spadina Ave. Suite 1900, Toronto, ON M5V 0S8, Canada, Toronto, ON"}},"organizer":{"@type":"Organization","name":"Toronto Java Users Group","url":"https://www.meetup.com/toronto-java-users-group/"},"performer":"Toronto Java Users Group"},{"@context":"https://schema.org","@type":"Event","name":"AI Workshop with Neo4j and Google - Toronto","url":"https://www.meetup.com/aittg-toronto/events/316671713/","description":"Important note: Register on [AICamp event website](https://www.aicamp.ai/event/eventdetails/W2026100610) is REQUIRED for admission.\n\nJoin Neo4j and Google Cloud for an hands-on workshop where you’ll learn how to build AI agents powered by knowledge graphs. **Limited to 50 qualified builders.**\n\nThis session goes beyond theory—you’ll actively work with real-world datasets and deploy Neo4j alongside Google Cloud Gemini Enterprise in a live cloud environment. Designed for data scientists and data engineers, this workshop walks you through the complete workflow—from parsing and loading data using both traditional and AI-driven techniques, to constructing intelligent agents that query and reason over connected data.\n\n**What You Will Learn:**\n✅ Build AI agents that leverage knowledge graphs\n✅ Integrate Neo4j with Google Cloud Gemini Enterprise in a production-ready environment\n✅ Traditional vs. AI-driven data parsing and loading\n✅ Practical approaches to graph-based AI using real-world datasets\n\n**Who should attend:**\nDevelopers, Builders, Data engineers, Data scientists, and Tech leaders.\n\n**Featured Speakers:**\n\n* Ben Lackey, Neo4j\n* Ezra Uzosike, Google","startDate":"2026-10-06T17:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Google King East","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"65 King St E, Toronto, ON M5C 1G3, Canada, Toronto, ON"}},"organizer":{"@type":"Organization","name":"Toronto AI Developers Group","url":"https://www.meetup.com/aittg-toronto/"},"performer":"Toronto AI Developers Group"},{"@context":"https://schema.org","@type":"Event","name":"The Remix Jam 2026 Pre Launch Mixer","url":"https://www.meetup.com/h2-meetup/events/316673104/","description":"Start your engines! For the 2nd year running, come huddle with fellow developers and engineers on **Thursday, October 1, 2026**, and pull into the pit lane at **Wealthsimple’s** stunning downtown Toronto headquarters. Before Friday's main conference, we are once again hosting a kick off to the **[Remix Jam 2026](https://remix.run/jam/2026)** with a night of high-speed networking, lightning-fast talks and friendly chatter IRL in preparation of the next day's big **Remix 3** launch. Come out and connect with fellow drivers, meet members of the Remix pit crew as we get ready for the big day.\nThis meetup is open to all. RSVP is mandatory.\n\n**Pre Remix Jam 2026 Mixer**\n📅 Thursday October 1, 2026\n📍 Wealthsimple, 80 Spadina, 4th floor\n⏰ 6-9pm\n\npresenters will be announced very shortly.","startDate":"2026-10-01T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-5-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Wealthsimple","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"80 Spadina Ave. 4th Floor, Toronto, ON M5V 2J4, Canada, Toronto, ON"}},"organizer":{"@type":"Organization","name":"A Meetup called H2","url":"https://www.meetup.com/h2-meetup/"},"performer":"A Meetup called H2"},{"@context":"https://schema.org","@type":"Event","name":"Secure Development Tournament","url":"https://www.meetup.com/owasp-toronto/events/316723445/","description":"**What Is a SecureFlag Tournament?**\nAttendees will compete to solve hands-on coding labs in a time-bound challenge inside fully provisioned hands-on development environments. The goal of the competition is to identify vulnerabilities in running applications, then write and submit fixes that must pass both security and functional tests. A live leaderboard will track progress in real time, and the top three performers win gift cards from SecureFlag.\n\n**Why It Works**\n● Capture the Flag format, Reimagined: Instead of only hacking, secure the flag! Fix real vulnerabilities in real code, and learn by doing!\n● No setup required: Just bring a laptop and scan a QR code. Labs run in the browser with everything pre-configured. No local installs. No VMs. No wasted time.\n● Relevant to every developer. With 50+ supported technologies including Python, Java, AWS, Kubernetes, and Terraform, there is a wide selection of challenges available.\n● All skill levels are welcome. Labs range from beginner to advanced. A built-in hint system helps those who get stuck, while experienced developers can push for maximum points with minimal hints and no retries.\n● Competitive leaderboards, prizes, and pizza!\n\n**FAQ**\n\n* What do I need to bring?\n* A laptop and power cord.\n* Will my email be shared with the organizers?\n* Yes! To sign-up for the lab you will need to share your email address. Collected emails will not be used for marketing purposes.\n* Is this in-person only?\n* Yes, to provide the best possible experience.","startDate":"2026-10-05T22:30:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-4-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"Security Compass","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"325 Front Street West, Unit 103, Toronto, ON M5V 2Y1, Toronto, ON"}},"organizer":{"@type":"Organization","name":"OWASP Toronto Chapter","url":"https://www.meetup.com/owasp-toronto/"},"performer":"OWASP Toronto Chapter"},{"@context":"https://schema.org","@type":"Event","name":"Together Toronto and YC Winter 2027 (W27) Application Session","url":"https://www.meetup.com/techto/events/316492775/","description":"**This is a paid event. You must register and have a ticket to attend.** 👉 **[Together Toronto and YC Winter 2027 (W27) Application Session](https://luma.com/together-toronto-october-2026)**\n\n**Together Toronto - the stories behind how companies actually get built here.**\n\nThe stories that actually shape how companies get built in this city rarely make it onto a stage. This one's different.\n\nTogether Toronto is TechTO's signature gathering for founders, operators, builders, and investors who want more than inspiration - they want the real playbook. Real founders. Honest conversations about what it took to launch, scale, and survive Toronto's tech scene.\n\nWhether you're building your first company, scaling a team, or figuring out what's next - this is the event worth showing up for.\n\n**You'll leave with:**\n\n* Founder stories with the specifics left in\n* Connections with the people building what's next\n* Conversations that challenge how you think about your own company\n\n📅 Monday\\, Oct 5\\| 6PM\\- 9PM\n📍 Downtown Toronto\n🎟️ Paid event \\- tickets required \\| Free for TechTO Members\n\n**Register via Luma:** [https://luma.com/together-toronto-october-2026](https://luma.com/together-toronto-october-2026)","startDate":"2026-10-05T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-1-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"U of T: Schwartz Reisman Innovation Campus","address":{"@type":"PostalAddress","addressLocality":"Toronto, ON","addressRegion":"ON","addressCountry":"ca","streetAddress":"108 College St, Toronto, ON, ON"}},"organizer":{"@type":"Organization","name":"TechTO","url":"https://www.meetup.com/techto/"},"performer":"TechTO"},{"@context":"https://schema.org","@type":"Event","name":"Health Toronto | Sept 28, 2026","url":"https://www.meetup.com/techto/events/316492574/","description":"**This is a paid event. You must register and have a ticket to attend.** 👉 **[Health Toronto - Sept 28](https://luma.com/health-toronto-september-28-2026)**\n\n**Health Toronto - the hard calls behind building in Canadian healthcare.**\n\nCanadian healthcare is one of the hardest spaces to build in, and it's rarely built alone. Where to build, when to partner, when to sell, what happens to your edge when AI lets incumbents build it in-house, how to earn trust in Canada's most regulated markets - you won't find these answers in a deck.\nHear them straight from founders, clinicians, and operators who've spent years making these exact calls.\n**You'll leave with:**\n\n* Real conversations with founders navigating regulation, funding, and clinical trust\n* Practical insights you can use before your next fundraise or launch\n* A room of 200+ tech professionals building in Canada's healthcare space\n\n📅 Monday\\, September 28 \\| 6PM\\- 9PM\n📍 GreenShield Toronto\n🎟️ Paid event \\- tickets required \\| Free for TechTO Members\n\n**Register via Luma:** [https://luma.com/health-toronto-september-28-2026](https://luma.com/health-toronto-september-28-2026)","startDate":"2026-09-28T22:00:00.000Z","endDate":"","eventStatus":"https://schema.org/EventScheduled","image":"/images/fallbacks/redesign/group-cover-1-square.webp","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":"30 Wellington Street West","address":{"@type":"PostalAddress","addressLocality":"Toronto","addressRegion":"ON","addressCountry":"ca","streetAddress":"30 Wellington St W, Toronto, ON M5L 1B1, Canada, Toronto, ON"}},"organizer":{"@type":"Organization","name":"TechTO","url":"https://www.meetup.com/techto/"},"performer":"TechTO"}]</script>
